name: Deploy Boomergames to GCP (Compute Engine + Artifact Registry)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to commit SHA)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: europe-west3
  AR_REPO: boomergames
  IMAGE_NAME: boomer-server

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Run quality gates (fmt, clippy, release tests, native+WASM determinism)
        run: |
          make check
          cargo test --workspace --release
          make determinism

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push distroless container image
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${TAG}"
          LATEST="${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Trigger graceful drain & restart container on Compute Engine VM (via IAP)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="docker pull ${GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:latest && docker stop --time=900 boomergames || true && docker rm boomergames || true && sudo systemctl restart boomergames.service"
