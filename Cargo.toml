[workspace]
resolver = "3"
members = [
    "crates/boomer-domain",
    "crates/boomer-protocol",
    "crates/boomer-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
boomer-domain = { path = "crates/boomer-domain" }
boomer-protocol = { path = "crates/boomer-protocol" }
js-sys = "0.3"
libm = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
